services:
  helmies:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - helmies_data:/data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  helmies_data:
